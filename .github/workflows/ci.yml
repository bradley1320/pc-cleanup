name: CI

# Two jobs rather than a matrix: GitHub Actions does not allow expressions in a
# step's "shell:" key, and jobs.<job_id>.defaults.run.shell forbids contexts
# outright, so the shell cannot be selected per matrix leg. The actual work lives
# in build/ci/Invoke-CIStage.ps1 so the two legs cannot drift apart.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # Windows PowerShell 5.1 is the runtime users actually get: Run.bat invokes
  # powershell.exe, and 5.1 is what ships with Windows 10/11. Several of its
  # behaviours differ from PowerShell 7 in ways that have already caused real
  # defects here -- a one-item collection unrolls to a scalar with no .Count, and
  # ConvertFrom-Json emits a JSON array as a single pipeline object. Neither
  # reproduces under pwsh, so this is the leg that guards the shipped experience.
  windows-powershell-51:
    name: lint-and-test (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install modules
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage Install

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage Lint

      - name: Run Pester Tests
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage Test

      - name: Run Build
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage Build

      - name: Verify config files copied
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage VerifyConfig

      - name: Verify source is pure ASCII
        shell: powershell
        run: .\build\ci\Invoke-CIStage.ps1 -Stage VerifyAscii

  # PowerShell 7 is not a target runtime. It runs anyway to catch accidental
  # 5.1-only syntax and to keep forward compatibility honest.
  powershell-7:
    name: lint-and-test (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install modules
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage Install

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage Lint

      - name: Run Pester Tests
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage Test

      - name: Run Build
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage Build

      - name: Verify config files copied
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage VerifyConfig

      - name: Verify source is pure ASCII
        shell: pwsh
        run: ./build/ci/Invoke-CIStage.ps1 -Stage VerifyAscii
