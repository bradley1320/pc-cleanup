name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Install Pester 5.x
        shell: pwsh
        run: |
          # Pin to 5.x. -MinimumVersion alone installs the newest available, which
          # silently became Pester 6 -- and Pester 6 throws on an unmatched mock
          # instead of falling through, breaking mocks this suite relies on.
          Install-Module -Name Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          Write-Host "Pester $((Get-Module Pester).Version) / PowerShell $($PSVersionTable.PSVersion)"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path src/ -Recurse -Severity Warning,Error -Settings .psscriptanalyzerrc.psd1
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer: all clear." -ForegroundColor Green

      - name: Run Pester Tests
        shell: pwsh
        run: |
          # Explicit import: without it New-PesterConfiguration auto-loads the
          # highest installed version, which on a hosted runner can be Pester 6.
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          Write-Host "Pester $((Get-Module Pester).Version) / PowerShell $($PSVersionTable.PSVersion)"
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/unit'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Run Build
        shell: pwsh
        run: |
          & build/Build.ps1
          if (-not (Test-Path dist/pccleanup.ps1)) {
              throw "Build.ps1 did not produce dist/pccleanup.ps1"
          }
          $lineCount = (Get-Content dist/pccleanup.ps1).Count
          Write-Host "Build produced $lineCount lines." -ForegroundColor Green

      - name: Verify config files copied
        shell: pwsh
        run: |
          $configs = @('tweaks.json', 'apps-bloat.json', 'apps-critical.json', 'profiles.json')
          foreach ($cfg in $configs) {
              $path = "dist/config/$cfg"
              if (-not (Test-Path $path)) {
                  throw "Build did not copy $cfg to dist/config/"
              }
          }
          Write-Host "All config files present in dist/." -ForegroundColor Green
